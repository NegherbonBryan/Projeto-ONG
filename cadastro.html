<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro ONG São Marcos</title>
    <link rel="stylesheet" href="Style-Cadastro.css" />
  </head>

  <body>
    <header>
      <a href="index.html">
        <img
          src="Logo-ONG-São-Marcos.png"
          alt="Logo ONG São Marcos"
          class="logo"
        />
      </a>
      <div class="titulo">
      <h1>Cadastro ONG São Marcos</h1>
      <h2>
        Nesse site você pode se cadastrar para ajudar a ONG São Marcos com
        doações e voluntariado.
      </h2>
      </div>
      </header>
    </header>

    <nav>
      <a href="index.html">Home</a>
      <a href="project.html">Projetos</a>
      <a href="cadastro.html">Cadastro</a>
    </nav>

    <form>
      <fieldset>
        <legend>Informações Pessoais</legend>

        <label for="nome">Nome Completo</label>
        <input id="nome" type="text" required />

        <label for="CPF">CPF</label>
        <input
          id="CPF"
          type="text"
          pattern="^[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}$"
          required
        />

        <label for="E-mail">E-mail</label>
        <input id="E-mail" type="email" required />
      </fieldset>

      <fieldset>
        <legend>Informações de Contato</legend>

        <label for="telefone">Telefone</label>
        <input
          id="telefone"
          type="tel"
          pattern="^\([0-9]{2}\) [0-9]{5}-[0-9]{4}$"
          required
        />

        <label for="CEP">CEP</label>
        <input id="CEP" type="text" pattern="^[0-9]{5}-[0-9]{3}$" required />

        <label for="Rua">Rua</label>
        <input id="Rua" type="text" required />

        <label for="N°">N°</label>
        <input id="N°" type="number" required />

        <label for="cidade">Cidade</label>
        <input id="cidade" type="text" required />

        <label for="Bairro">Bairro</label>
        <input id="Bairro" type="text" required />
      </fieldset>

      <button class="continuar">Continuar</button>
    </form>

    <footer>
      <address>
        <p>Telefone:<strong class="contato"> (47) 94785-4785</strong></p>
        <p>Email:<strong class="contato"> contato@ongsaomarcos.org</strong></p>
        <p>
          Endereço:
          <strong class="contato">
            Rua São Marcos, 123 - Bairro São Marcos
          </strong>
        </p>
      </address>
    </footer>
  </body>
</html>
